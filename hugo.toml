baseURL = "https://blog.openadapt.ai/"
languageCode = "en-us"
title = "OpenAdapt Blog"
theme = "PaperMod"
googleAnalytics = "G-CJ01Y19XJN"

[markup]
  [markup.highlight]
    # Class-based highlighting so the paper-terminal CSS controls token colors
    noClasses = false
    codeFences = true
    guessSyntax = false
    lineNos = false

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    url = "https://docs.openadapt.ai"
    weight = 38
  [[menu.main]]
    identifier = "openadapt"
    name = "openadapt.ai"
    url = "https://openadapt.ai"
    weight = 40
  [[menu.main]]
    identifier = "rss"
    name = "RSS"
    url = "/index.xml"
    weight = 50

[params]
  # SEO
  description = "Guides, updates, and automation recipes from the OpenAdapt project — record a GUI workflow once, compile it, replay it deterministically."
  env = "production"

  # Paper-terminal design: light theme only — no toggle, no dark mode
  defaultTheme = "light"
  disableThemeToggle = true

  mainSections = ["posts"]
  author = "OpenAdapt Team"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # Favicon
  [params.assets]
    theme_color = "#F2F1EC"
    msapplication_TileColor = "#F2F1EC"
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.homeInfoParams]
    Title = "OpenAdapt Blog"
    Content = "Guides, updates, and automation recipes from the OpenAdapt project — record a GUI workflow once, compile it, replay it deterministically."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/OpenAdaptAI"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/OpenAdaptAI"

  [[params.socialIcons]]
    name = "discord"
    url = "https://discord.gg/yF527cQbDG"

  [[params.socialIcons]]
    name = "rss"
    url = "https://blog.openadapt.ai/index.xml"
