baseURL = "https://blog.openadapt.ai/"
languageCode = "en-us"
title = "OpenAdapt Blog"
theme = "PaperMod"
googleAnalytics = "G-CJ01Y19XJN"

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[taxonomies]
  tag = "tags"

[menu]
  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "archive"
    name = "Archive"
    url = "/archive/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
  [[menu.main]]
    identifier = "recordings"
    name = "Recordings"
    url = "/recordings/"
    weight = 35
  [[menu.main]]
    identifier = "openadapt"
    name = "openadapt.ai"
    url = "https://openadapt.ai"
    weight = 40

[params]
  # SEO
  description = "Guides, updates, and automation recipes from the OpenAdapt project — open-source desktop automation using demo-conditioned AI agents."
  env = "production"

  # Force dark mode only — no toggle, no light mode
  defaultTheme = "dark"
  disableThemeToggle = true

  mainSections = ["posts"]
  author = "OpenAdapt Team"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true

  # Favicon
  [params.assets]
    favicon = "/favicon.ico"
    favicon16x16 = "/favicon-16x16.png"
    favicon32x32 = "/favicon-32x32.png"
    apple_touch_icon = "/apple-touch-icon.png"

  [params.homeInfoParams]
    Title = "OpenAdapt Blog"
    Content = "Guides, updates, and automation recipes from the OpenAdapt project — open-source desktop automation using demo-conditioned AI agents."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/OpenAdaptAI"

  [[params.socialIcons]]
    name = "twitter"
    url = "https://x.com/OpenAdaptAI"

  [[params.socialIcons]]
    name = "discord"
    url = "https://discord.gg/yF527cQbDG"
