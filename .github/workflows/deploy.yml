name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint-voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Voice lint (all posts)
        run: python3 scripts/lint_post_voice.py content/posts
      - name: Substance lint (all posts, advisory)
        run: python3 scripts/lint_post_substance.py content/posts
      - name: Benchmark claim guard tests
        run: python3 -m unittest discover -s tests
      # Offline: hashes the vendored upstream artifacts and compares every
      # published benchmark figure to them. The --online half, which refetches
      # from GitHub, runs daily in benchmark-claims-online.yml.
      - name: Benchmark claim binding (all posts + llms.txt)
        run: python3 scripts/check_benchmark_claims.py

  build:
    runs-on: ubuntu-latest
    needs: lint-voice
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --minify
      - name: Validate rendered newsletter forms
        run: python3 -S scripts/validate_newsletter_render.py public
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
