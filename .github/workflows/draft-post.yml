# Event-driven blog drafting pipeline: scan + classify (daily) -> author ->
# draft PR for human review. Nothing auto-publishes; posts land as draft: true
# in a draft PR. See docs/AUTOMATION.md for the rubric, honesty contract, and
# required ANTHROPIC_API_KEY secret.

name: Draft post (scan, classify, author)

on:
  schedule:
    - cron: "30 12 * * *" # daily, 12:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: draft-post
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      # SCAN_TOKEN (optional org-read PAT) lets the scan see private repos
      # like openadapt-cloud; the default token covers public repos only and
      # unreadable repos are skipped with a warning.
      GH_TOKEN: ${{ secrets.SCAN_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Skip if a draft is already waiting for review
        id: guard
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --json headRefName --jq '[.[] | select(.headRefName | startswith("auto-draft/"))] | length')
          if [ "$open" != "0" ]; then
            echo "An auto-draft PR is already open; skipping this scan." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # An auto-draft branch with no pull request means a previous run
          # authored a post and could not open the PR. Without this check the
          # daily scan pushes another such branch every day and they pile up
          # unreviewed -- the same unbounded-growth failure the watermark has.
          #
          # The test is "no PR was ever opened from this branch", not "the
          # branch exists". A merged PR whose head branch was never deleted
          # leaves that branch on origin permanently, and an existence-only
          # check reads it as a waiting draft forever.
          orphans=""
          for branch in $(git ls-remote --heads origin 'refs/heads/auto-draft/*' \
            | awk '{print $2}' | sed 's#refs/heads/##'); do
            prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" \
              --state all --json number,state)
            if [ "$(printf '%s' "$prs" | jq 'length')" = "0" ]; then
              if [ -z "$orphans" ]; then orphans="$branch"; else orphans="$orphans"$'\n'"$branch"; fi
              continue
            fi
            # A PR exists, so this branch is accounted for and must not block
            # the scan. Delete it once that PR is merged, so merged branches
            # stop accumulating and cannot cause this again. A branch whose PR
            # is open or closed-unmerged is left alone: its commits are not on
            # main, so deleting it would throw the draft away.
            if [ "$(printf '%s' "$prs" | jq '[.[] | select(.state == "MERGED")] | length')" != "0" ]; then
              echo "Deleting $branch; its pull request is already merged."
              git push origin --delete "$branch" \
                || echo "::warning title=Could not delete $branch::Its PR is merged. Delete the branch by hand."
            fi
          done
          if [ -n "$orphans" ]; then
            {
              echo "### Skipped: an auto-draft branch is waiting with no pull request"
              echo
              echo "Open a pull request from it, or delete it, then this scan resumes."
              echo
              echo "$orphans" | sed 's#^#- `#; s#$#`#'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v7
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: "3.12"

      - name: Install SDK
        if: steps.guard.outputs.skip == 'false'
        run: pip install anthropic

      - name: Scan and classify
        if: steps.guard.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 scripts/scan_and_classify.py

      - name: Read verdict
        id: verdict
        if: steps.guard.outputs.skip == 'false'
        run: |
          post=$(python3 -c "import json;print(str(json.load(open('.automation/out/verdict.json'))['post']).lower())")
          echo "post=$post" >> "$GITHUB_OUTPUT"

      - name: Author the post
        id: author
        if: steps.guard.outputs.skip == 'false' && steps.verdict.outputs.post == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          post_path=$(python3 scripts/author_post.py | tail -n 1)
          echo "post_path=$post_path" >> "$GITHUB_OUTPUT"

      - name: Voice lint (all posts, including the new draft)
        if: steps.author.outputs.post_path != ''
        run: python3 scripts/lint_post_voice.py content/posts

      - name: Substance lint (new draft, strict)
        if: steps.author.outputs.post_path != ''
        run: python3 scripts/lint_post_substance.py --strict "${{ steps.author.outputs.post_path }}"

      - name: Setup Hugo
        if: steps.author.outputs.post_path != ''
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Hugo build must pass
        if: steps.author.outputs.post_path != ''
        run: hugo --minify --buildDrafts

      - name: Open draft PR
        if: steps.author.outputs.post_path != ''
        env:
          # The workflow's own token opens the pull request. It needs the org
          # setting "Allow GitHub Actions to create and approve pull requests",
          # which is on; without it `gh pr create` fails with
          # "GitHub Actions is not permitted to create or approve pull
          # requests" and the failure handler below prints a one-click URL, so
          # no drafted post is lost.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          slug=$(basename "$(dirname "${{ steps.author.outputs.post_path }}")")
          branch="auto-draft/$slug"
          git config user.name "openadapt-blog-bot"
          git config user.email "bot@openadapt.ai"
          git checkout -b "$branch"

          # Advance the scan watermark; it takes effect when this PR merges.
          cp .automation/out/state.next.json .automation/state.json
          # Append near-miss candidates to the backlog.
          if [ -s .automation/out/backlog.md ]; then
            cat .automation/out/backlog.md >> docs/POST_BACKLOG.md
          fi

          git add "${{ steps.author.outputs.post_path }}" .automation/state.json docs/POST_BACKLOG.md
          git commit -m "draft: auto-drafted post ($slug)"
          git push origin "$branch"

          title="draft: $slug (auto-drafted, review required)"
          if gh pr create --draft \
              --title "$title" \
              --body-file .automation/out/pr_body.md \
              --base main --head "$branch"; then
            exit 0
          fi

          # The post is written, linted, built, and pushed -- only the pull
          # request could not be opened, which is a permission problem and not
          # a content problem. Surface everything needed to finish by hand so
          # the draft is not lost, then fail: the automation genuinely did not
          # complete, and a green run here would claim otherwise.
          {
            echo "### Draft pushed, but the pull request could not be opened"
            echo
            echo "Branch: \`$branch\`"
            echo
            echo "Open it in one click:"
            echo
            echo "<${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1>"
            echo
            echo "Or from a terminal:"
            echo
            echo '```'
            echo "gh pr create --draft --repo ${GITHUB_REPOSITORY} \\"
            echo "  --base main --head ${branch} \\"
            echo "  --title '${title}'"
            echo '```'
            echo
            echo "Check that the org setting \"Allow GitHub Actions to create and approve pull requests\" is still enabled."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Could not open the draft PR::The branch ${branch} was pushed. Open the PR by hand. See the run summary."
          exit 1

      - name: No post this scan
        if: steps.guard.outputs.skip == 'false' && steps.verdict.outputs.post != 'true'
        run: echo "Classifier verdict was below threshold; no PR opened (details in the scan summary above)."
