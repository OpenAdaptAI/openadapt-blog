<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Subscribed — OpenAdapt Blog</title>
    <style>
        :root {
            --paper-bg: #F5F7FA;
            --paper-panel: #FFFFFF;
            --paper-hairline: #DEE4EC;
            --paper-ink: #0B1220;
            --paper-ink-2: #414E63;
            --paper-accent: #0B7A5A;
            --radius: 8px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--paper-bg);
            color: var(--paper-ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
        }

        .card {
            background: var(--paper-panel);
            border: 1px solid var(--paper-hairline);
            border-radius: var(--radius);
            max-width: 32rem;
            margin: 2rem 1rem;
            padding: 2.5rem 2rem;
            text-align: center;
        }

        h1 {
            font-family: "Avenir Next", "Segoe UI", -apple-system, sans-serif;
            font-weight: 600;
            margin: 0 0 0.75rem;
        }

        p {
            color: var(--paper-ink-2);
            margin: 0 0 1.5rem;
        }

        a {
            color: var(--paper-accent);
            text-decoration: none;
            border-bottom: 1px solid color-mix(in srgb, var(--paper-accent) 58%, transparent);
        }

        a:hover {
            border-bottom-color: var(--paper-accent);
        }
    </style>
</head>
<body>
    <main class="card">
        <h1>You're subscribed</h1>
        <p>Thanks for subscribing to the OpenAdapt blog. New posts will arrive in your inbox.</p>
        <a href="/">Back to the blog</a>
    </main>
</body>
</html>
